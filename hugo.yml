baseURL: "https://aidenxie.net/"
locale: "en-AU"
title: "Aiden Xie | IT Portfolio"
theme: "PaperMod"

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Aiden Xie"
  description: "IT Portfolio, Technical Labs and Troubleshooting Documentation"
  author: "Aiden Xie"
  mainSections: []

  fuseOpts:
    keys:
      - title
      - permalink
      - summary
      - content
    threshold: 0.35
    ignoreLocation: true

  socialIcons:
    - name: github
      url: "https://github.com/aidenxieau"
    - name: linkedin
      url: "https://www.linkedin.com/in/aiden-xie-6925783b1/"

menu:
  main:
    - identifier: labs
      name: Labs
      url: labs/
      weight: 10

    - identifier: search
      name: Search
      url: search/
      weight: 35

    - identifier: about
      name: About
      url: about/
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
